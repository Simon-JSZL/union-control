<text x="280" y="1244.0" font-size="22" text-anchor="start" font-weight="400" fill="#48564d">说明：页面敏感数据处理依据 union-control；加密机及代理、UOPS 报文链路按所述目标架构绘制。</text>
<text x="280" y="1281.0" font-size="21" text-anchor="start" font-weight="400" fill="#48564d">图示为脱敏展示场景；密码服务调用及报文传输协议以实际接入为准。绿色为联合运维业务模块，红色为密码设备。</text>
